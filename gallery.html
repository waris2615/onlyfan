<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | witfans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dark: "#050505",
              darker: "#000000",
              accent: "#ffffff",
              subtle: "#222222",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Montserrat", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-darker text-white antialiased selection:bg-white selection:text-black">
    <!-- Sticky Header -->
    <header class="fixed top-0 w-full z-50 bg-darker/90 backdrop-blur-md border-b border-subtle transition-all duration-300">
      <div class="max-w-7xl mx-auto px-4 md:px-6 h-16 md:h-20 flex items-center justify-between">
        <a href="index.html" class="font-display font-black text-xl md:text-2xl tracking-widest uppercase">witfans</a>
        
        <nav class="hidden md:flex items-center space-x-6">
          <a href="index.html" class="text-gray-400 hover:text-white transition-colors text-sm">Home</a>
          <a href="gallery.html" class="text-white hover:text-white transition-colors text-sm">Gallery</a>
          <a href="pricing.html" class="text-gray-400 hover:text-white transition-colors text-sm">Pricing</a>
          <a href="about.html" class="text-gray-400 hover:text-white transition-colors text-sm">About</a>
          <a href="contact.html" class="text-gray-400 hover:text-white transition-colors text-sm">Contact</a>
        </nav>
        
        <div class="flex items-center gap-3">
          <button id="mobile-menu-btn" class="md:hidden p-2 text-white" onclick="toggleMobileMenu()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
      
      <div id="mobile-menu" class="hidden md:hidden bg-darker border-t border-subtle">
        <div class="px-4 py-4 space-y-3">
          <a href="index.html" class="block text-gray-400 py-2 text-sm">Home</a>
          <a href="gallery.html" class="block text-white py-2 text-sm">Gallery</a>
          <a href="pricing.html" class="block text-gray-400 py-2 text-sm">Pricing</a>
          <a href="about.html" class="block text-gray-400 py-2 text-sm">About</a>
          <a href="contact.html" class="block text-gray-400 py-2 text-sm">Contact</a>
        </div>
      </div>
    </header>

    <script>
      function toggleMobileMenu() {
        document.getElementById('mobile-menu').classList.toggle('hidden');
      }
    </script>

    <!-- Gallery Header -->
    <section class="pt-28 md:pt-32 pb-12 md:pb-16 px-4 md:px-6 bg-darker">
      <div class="max-w-7xl mx-auto text-center">
        <h1 class="font-display font-black text-4xl md:text-5xl lg:text-6xl mb-4">Full Gallery</h1>
        <p class="text-gray-400 max-w-2xl mx-auto">A collection of exclusive content. Subscribe to unlock all.</p>
      </div>
    </section>

    <!-- Gallery Grid -->
    <section class="py-12 md:py-16 px-4 md:px-6 bg-dark">
      <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6">
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8804.jpeg" alt="Gallery 1" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8805.jpeg" alt="Gallery 2" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8806.jpeg" alt="Gallery 3" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8809.jpeg" alt="Gallery 4" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8810.jpeg" alt="Gallery 5" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8811.jpeg" alt="Gallery 6" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8812.jpeg" alt="Gallery 7" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
          <div class="relative group aspect-[4/5] overflow-hidden sharp-border">
            <img src="assets/images/IMG_8813.jpeg" alt="Gallery 8" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          </div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="py-16 px-4 bg-darker border-t border-subtle text-center">
      <h2 class="font-display font-bold text-2xl md:text-3xl mb-4">Want to see more?</h2>
      <p class="text-gray-400 mb-8">Subscribe to unlock the full gallery</p>
      <a href="pricing.html" class="inline-block bg-white text-black px-8 py-4 text-lg hover:bg-gray-200 transition-colors">View Pricing</a>
    </section>

    <!-- Footer -->
    <footer class="py-12 px-4 bg-darker border-t border-subtle">
      <div class="max-w-7xl mx-auto text-center">
        <p class="text-gray-500 text-sm">&copy; 2026 witfans. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
